<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>My MC Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="logo">M</div>

      <button class="nav-btn active" title="Home">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="nav-btn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2L10 21h4l.6-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5A7 7 0 0 0 19 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>

      <div class="sidebar-spacer"></div>

      <button id="account-avatar" class="avatar" title="Not logged in">?</button>
    </nav>

    <!-- Main -->
    <main>
      <header class="topbar">
        <div>
          <h1>Home</h1>
          <p class="subtitle">Pick a version and jump in</p>
        </div>
        <div id="account-box">
          <span id="account-name">Not logged in</span>
          <button id="login-btn">Log in with Microsoft</button>
          <button id="logout-btn" class="hidden secondary">Log out</button>
        </div>
      </header>

      <section class="instance-card">
        <div class="instance-info">
          <div class="instance-icon" id="loader-icon">V</div>
          <div>
            <div class="instance-title" id="instance-title">Vanilla</div>
            <div class="instance-sub" id="instance-sub">Select a version below</div>
          </div>
        </div>

        <div class="instance-controls">
          <div class="field">
            <label for="loader-select">Mod Loader</label>
            <select id="loader-select">
              <option value="vanilla">Vanilla</option>
              <option value="fabric">Fabric</option>
              <option value="forge">Forge</option>
            </select>
          </div>

          <div class="field">
            <label for="mc-version-select">Minecraft Version</label>
            <select id="mc-version-select"></select>
          </div>

          <div class="field hidden" id="loader-version-field">
            <label for="loader-version-select">Loader Version</label>
            <select id="loader-version-select"></select>
          </div>

          <div class="field">
            <label>Memory: <span id="ram-label"></span> GB</label>
            <input type="range" id="ram-slider" min="1" max="16" step="1" />
          </div>
        </div>

        <button id="play-btn" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M8 5v14l11-7z"/></svg>
          <span>Log in to play</span>
        </button>
      </section>

      <section class="log-section">
        <div class="log-header">Console</div>
        <div id="log-box"></div>
      </section>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
